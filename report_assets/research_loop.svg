<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Autonomous experiment ratchet</title>
  <desc id="desc">The research loop reads the current best state, chooses a hypothesis, makes one change, runs and measures the experiment, verifies gates, records the result, and returns to the best state.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
  </defs>
  <rect width="1000" height="420" fill="#f5f5f5"/>
  <text x="48" y="44" fill="#2d3142" font-family="Arial, sans-serif" font-size="24" font-weight="700">The experiment ratchet</text>
  <text x="48" y="68" fill="#4f5d75" font-family="Arial, sans-serif" font-size="12">A candidate moves forward only when the evidence supports it.</text>

  <g fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)">
    <path d="M192 168 H240"/>
    <path d="M384 168 H432"/>
    <path d="M576 168 H624"/>
    <path d="M696 208 V232 H504 V252"/>
    <path d="M432 292 H384"/>
  </g>
  <path d="M312 336 V368 H40 V168 H48" fill="none" stroke="#eb6c36" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-accent)"/>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="48" y="128" width="144" height="80" rx="6" fill="#fbe8de" stroke="#eb6c36" stroke-width="2"/>
      <text x="120" y="151" fill="#eb6c36" font-size="9" font-weight="700" letter-spacing="1.4">START</text>
      <text x="120" y="177" fill="#2d3142" font-size="14" font-weight="700">Read current BEST</text>
      <text x="120" y="194" fill="#4f5d75" font-size="10">state + recent evidence</text>
    </g>
    <g>
      <rect x="240" y="128" width="144" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="312" y="151" fill="#7a8399" font-size="9" font-weight="700" letter-spacing="1.2">DESIGN</text>
      <text x="312" y="177" fill="#2d3142" font-size="14" font-weight="700">Choose hypothesis</text>
      <text x="312" y="194" fill="#4f5d75" font-size="10">one useful question</text>
    </g>
    <g>
      <rect x="432" y="128" width="144" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="504" y="151" fill="#7a8399" font-size="9" font-weight="700" letter-spacing="1.2">CHANGE</text>
      <text x="504" y="177" fill="#2d3142" font-size="14" font-weight="700">Make one change</text>
      <text x="504" y="194" fill="#4f5d75" font-size="10">smallest useful test</text>
    </g>
    <g>
      <rect x="624" y="128" width="144" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="696" y="151" fill="#7a8399" font-size="9" font-weight="700" letter-spacing="1.2">EXECUTE</text>
      <text x="696" y="177" fill="#2d3142" font-size="14" font-weight="700">Run + measure</text>
      <text x="696" y="194" fill="#4f5d75" font-size="10">scores + artifacts</text>
    </g>
    <g>
      <rect x="432" y="252" width="144" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="504" y="275" fill="#7a8399" font-size="9" font-weight="700" letter-spacing="1.2">VERIFY</text>
      <text x="504" y="301" fill="#2d3142" font-size="14" font-weight="700">Check gates</text>
      <text x="504" y="318" fill="#4f5d75" font-size="10">integrity + transfer</text>
    </g>
    <g>
      <rect x="240" y="252" width="144" height="80" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="312" y="275" fill="#7a8399" font-size="9" font-weight="700" letter-spacing="1.2">DECIDE</text>
      <text x="312" y="301" fill="#2d3142" font-size="14" font-weight="700">Keep / discard</text>
      <text x="312" y="318" fill="#4f5d75" font-size="10">record the lesson</text>
    </g>
  </g>

  <line x1="48" y1="388" x2="952" y2="388" stroke="#c8ccd4"/>
  <text x="48" y="410" fill="#4f5d75" font-family="Arial, sans-serif" font-size="11">The dashed return is research memory. A failure narrows the next question instead of disappearing.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Kidney stone research pipeline</title>
  <desc id="desc">Original CT slices are indexed, split by patient, trained in five cross-validation folds, evaluated with patient-level out-of-fold metrics, and combined into the E023 five-checkpoint development candidate.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
  </defs>
  <rect width="1200" height="360" fill="#f5f5f5"/>
  <text x="48" y="44" fill="#2d3142" font-family="Arial, sans-serif" font-size="24" font-weight="700">From CT slices to a verified development candidate</text>
  <text x="48" y="68" fill="#4f5d75" font-family="Arial, sans-serif" font-size="12">The patient is the unit of evaluation; slices provide the evidence.</text>

  <g fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)">
    <path d="M176 176 H208"/>
    <path d="M356 176 H388"/>
    <path d="M536 176 H568"/>
    <path d="M716 176 H748"/>
    <path d="M896 176 H928" stroke="#eb6c36" marker-end="url(#arrow-accent)"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="48" y="128" width="128" height="96" rx="6" fill="#eef0f3" stroke="#7a8399"/>
      <text x="112" y="151" fill="#7a8399" font-size="9" font-weight="700" letter-spacing="1.4">SOURCE</text>
      <text x="112" y="181" fill="#2d3142" font-size="14" font-weight="700">CT slices</text>
      <text x="112" y="201" fill="#4f5d75" font-size="11">3,364 originals</text>
    </g>
    <g>
      <rect x="228" y="128" width="128" height="96" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="292" y="151" fill="#7a8399" font-size="9" font-weight="700" letter-spacing="1.4">INDEX</text>
      <text x="292" y="181" fill="#2d3142" font-size="14" font-weight="700">Manifest</text>
      <text x="292" y="201" fill="#4f5d75" font-size="11">patient + source IDs</text>
    </g>
    <g>
      <rect x="408" y="128" width="128" height="96" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="472" y="151" fill="#7a8399" font-size="9" font-weight="700" letter-spacing="1.4">BOUNDARY</text>
      <text x="472" y="181" fill="#2d3142" font-size="14" font-weight="700">Patient split</text>
      <text x="472" y="201" fill="#4f5d75" font-size="11">161 dev / 40 sealed</text>
    </g>
    <g>
      <rect x="588" y="128" width="128" height="96" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="652" y="151" fill="#7a8399" font-size="9" font-weight="700" letter-spacing="1.4">TRAIN</text>
      <text x="652" y="181" fill="#2d3142" font-size="14" font-weight="700">Five folds</text>
      <text x="652" y="201" fill="#4f5d75" font-size="11">originals only</text>
    </g>
    <g>
      <rect x="768" y="128" width="128" height="96" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="832" y="151" fill="#7a8399" font-size="9" font-weight="700" letter-spacing="1.4">MEASURE</text>
      <text x="832" y="181" fill="#2d3142" font-size="14" font-weight="700">OOF metrics</text>
      <text x="832" y="201" fill="#4f5d75" font-size="11">patient ROC-AUC</text>
    </g>
    <g>
      <rect x="948" y="120" width="176" height="112" rx="6" fill="#fbe8de" stroke="#eb6c36" stroke-width="2"/>
      <text x="1036" y="145" fill="#eb6c36" font-size="9" font-weight="700" letter-spacing="1.4">VERIFIED CANDIDATE</text>
      <text x="1036" y="179" fill="#2d3142" font-size="16" font-weight="700">E023 ensemble</text>
      <text x="1036" y="201" fill="#4f5d75" font-size="11">AUC 0.853414</text>
      <text x="1036" y="218" fill="#4f5d75" font-size="11">transfer gates pass</text>
    </g>
  </g>

  <line x1="48" y1="286" x2="1152" y2="286" stroke="#c8ccd4"/>
  <text x="48" y="314" fill="#7a8399" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">READING RULE</text>
  <text x="48" y="336" fill="#4f5d75" font-family="Arial, sans-serif" font-size="12">The sealed partition is not a tuning resource. E023 is a development result, not an external clinical validation result.</text>
</svg>

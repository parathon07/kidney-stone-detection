<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">E023 research inference workflow</title>
  <desc id="desc">A new patient's original CT slices are preprocessed, passed through five E023 fold checkpoints, averaged per slice and then per patient, and compared with the locked development threshold.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
  </defs>
  <rect width="1200" height="360" fill="#f5f5f5"/>
  <text x="48" y="44" fill="#2d3142" font-family="Arial, sans-serif" font-size="24" font-weight="700">How E023 would be used for research inference</text>
  <text x="48" y="68" fill="#4f5d75" font-family="Arial, sans-serif" font-size="12">Use a complete patient study; a single slice is not the final decision unit.</text>

  <g fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)">
    <path d="M176 176 H208"/>
    <path d="M356 176 H388"/>
    <path d="M536 176 H568"/>
    <path d="M716 176 H748"/>
    <path d="M896 176 H928" stroke="#eb6c36" marker-end="url(#arrow-accent)"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="48" y="128" width="128" height="96" rx="6" fill="#eef0f3" stroke="#7a8399"/>
      <text x="112" y="151" fill="#7a8399" font-size="9" font-weight="700" letter-spacing="1.4">INPUT</text>
      <text x="112" y="181" fill="#2d3142" font-size="14" font-weight="700">Patient slices</text>
      <text x="112" y="201" fill="#4f5d75" font-size="11">IDs required</text>
    </g>
    <g>
      <rect x="228" y="128" width="128" height="96" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="292" y="151" fill="#7a8399" font-size="9" font-weight="700" letter-spacing="1.4">PREPARE</text>
      <text x="292" y="181" fill="#2d3142" font-size="14" font-weight="700">384×384 gray</text>
      <text x="292" y="201" fill="#4f5d75" font-size="11">same preprocessing</text>
    </g>
    <g>
      <rect x="408" y="128" width="128" height="96" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="472" y="151" fill="#7a8399" font-size="9" font-weight="700" letter-spacing="1.4">ENSEMBLE</text>
      <text x="472" y="181" fill="#2d3142" font-size="14" font-weight="700">Five models</text>
      <text x="472" y="201" fill="#4f5d75" font-size="11">equal probability mean</text>
    </g>
    <g>
      <rect x="588" y="128" width="128" height="96" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="652" y="151" fill="#7a8399" font-size="9" font-weight="700" letter-spacing="1.4">AGGREGATE</text>
      <text x="652" y="181" fill="#2d3142" font-size="14" font-weight="700">Patient mean</text>
      <text x="652" y="201" fill="#4f5d75" font-size="11">one score per patient</text>
    </g>
    <g>
      <rect x="768" y="128" width="128" height="96" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="832" y="151" fill="#7a8399" font-size="9" font-weight="700" letter-spacing="1.4">DECIDE</text>
      <text x="832" y="181" fill="#2d3142" font-size="14" font-weight="700">Threshold</text>
      <text x="832" y="201" fill="#4f5d75" font-size="11">0.4531617</text>
    </g>
    <g>
      <rect x="948" y="120" width="176" height="112" rx="6" fill="#fbe8de" stroke="#eb6c36" stroke-width="2"/>
      <text x="1036" y="145" fill="#eb6c36" font-size="9" font-weight="700" letter-spacing="1.4">OUTPUT</text>
      <text x="1036" y="179" fill="#2d3142" font-size="16" font-weight="700">Research result</text>
      <text x="1036" y="201" fill="#4f5d75" font-size="11">Stone / Non-Stone</text>
      <text x="1036" y="218" fill="#4f5d75" font-size="11">+ probability + audit trail</text>
    </g>
  </g>

  <line x1="48" y1="286" x2="1152" y2="286" stroke="#c8ccd4"/>
  <text x="48" y="314" fill="#7a8399" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">IMPORTANT</text>
  <text x="48" y="336" fill="#4f5d75" font-family="Arial, sans-serif" font-size="12">This workflow is a research prototype design. The repository has no safe user-facing infer command yet.</text>
</svg>
